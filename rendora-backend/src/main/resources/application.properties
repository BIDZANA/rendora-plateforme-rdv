spring.application.name=rendora
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/rendora}
spring.datasource.username=${DB_USER:rendora}
spring.datasource.password=${DB_PASSWORD:rendora_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
